<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      html {
        height: 100%;
      }
      body {
        position: relative;
        min-height: 100%;
        overflow: hidden auto;
      }
    </style>
  </head>
  <body>
    <img
      src="./assets/images/background-image.png"
      alt=""
      style="width: 100%; height: 100%; position: absolute; z-index: 0"
    />
    <a
      href=""
      style="
        width: 4vw;
        height: 4vw;
        line-height: 0;
        position: absolute;
        top: 4%;
        left: 2%;
      "
    >
      <img
        src="./assets/images/HOME.png"
        alt=""
        style="width: 100%; height: auto"
      />
    </a>
    <div style="position: relative; padding: 2%">
      <div style="width: 100%; text-align: center; font-size: 3vw">
        Who is Jain?
      </div>
    </div>

    <div
      style="
        width: 100%;
        position: relative;
        height: auto;
        padding: 2%;
        display: flex;
      "
    >
      <div
        class="left"
        style="
          width: 30%;
          height: auto;
          display: flex;
          justify-content: center;
          flex-wrap: wrap;
        "
      >
        <div style="width: 100%; height: auto; position: relative">
          <div style="width: 60%; height: auto; position: relative">
            <img
              src="assets/images/topic-image.png"
              alt=""
              style="width: 100%; height: auto"
            />
            <div
              style="
                position: absolute;
                padding: 1% 3%;
                border: 0.2vw solid white;
                border-radius: 50%;
                color: white;
                top: 18%;
                left: 50%;
                transform: translate(-50%, -50%);
              "
            >
              1
            </div>
            <div
              style="
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 94%;
                text-align: center;
                background: red;
              "
            >
              who is Jain Sandhu?
            </div>
          </div>
        </div>
      </div>
      <div class="mid" style="width: 40%; height: auto">
        <img src="assets/images/hero-image.png" alt="" style="width: 100%" />
      </div>
      <div class="righ" style="width: 30%; height: auto">
        <div>
          <div></div>
          <div></div>
          <div></div>
        </div>
      </div>
    </div>
  </body>
</html>
